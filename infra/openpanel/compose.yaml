name: test-panel-analytics

x-app: &app
  restart: unless-stopped
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  op-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      op-api:
        condition: service_healthy
      op-dashboard:
        condition: service_healthy

  op-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run openpanel:setup first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  op-kv:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  op-ch:
    image: clickhouse/clickhouse-server:25.10.2.65
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/op-config.xml:ro
      - ./clickhouse/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'clickhouse-client', '--query', 'SELECT 1']
      interval: 5s
      timeout: 5s
      retries: 20

  op-api:
    <<: *app
    image: lindesvard/openpanel-api:2
    command: >-
      sh -c 'CI=true pnpm -r run migrate:deploy && pnpm start'
    depends_on:
      op-db:
        condition: service_healthy
      op-kv:
        condition: service_healthy
      op-ch:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/healthcheck || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  op-dashboard:
    <<: *app
    image: lindesvard/openpanel-dashboard:2
    depends_on:
      op-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/healthcheck || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  op-worker:
    <<: *app
    image: lindesvard/openpanel-worker:2
    depends_on:
      op-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/healthcheck || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
